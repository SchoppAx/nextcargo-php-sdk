name: PHPUnit

on:
  # Run on all main pushes and on all pull requests.
  push:
    branches:
      - main
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            coverage: none
          - php: '8.3'
            coverage: none
          - php: '8.4'
            coverage: none
          - php: '8.5'
            coverage: xdebug
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage }}
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: locked
      - name: Run PHPUnit tests
        if: matrix.coverage == 'none'
        run: >
          composer test --
          --no-coverage
          --colors=never
          --do-not-cache-result
          --display-phpunit-deprecations
          --fail-on-warning
      - name: Run PHPUnit tests with coverage
        if: matrix.coverage == 'xdebug'
        run: >
          composer test:coverage --
          --colors=never
          --do-not-cache-result
          --display-phpunit-deprecations
          --fail-on-warning
      - name: Upload coverage report for badge generation
        if: >
          matrix.coverage == 'xdebug' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: phpunit-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  coverage-badge:
    name: Publish coverage badge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - tests
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phpunit-coverage
          path: badge-input
      - name: Generate coverage badge
        uses: timkrase/phpunit-coverage-badge@b2cec23f5564ebf1030a6aa5b1e0fcadc5674d79
        with:
          report: badge-input/coverage.xml
          report_type: clover
          coverage_badge_path: badge-output/coverage.svg
          push_badge: false
      - name: Publish coverage badge
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: ./badge-output
          force_orphan: true
          commit_message: "Update code coverage badge"